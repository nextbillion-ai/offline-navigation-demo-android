name: Android CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Authenticate to Google Cloud Artifact Registry
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_ARTIFACT_REGISTRY_CREDENTIALS }}'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tests, lint, and release-equivalent build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleR8Smoke --no-daemon
